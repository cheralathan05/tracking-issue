services:
  # ============================================================================
  # 1. BACKEND API SERVICE (Node.js Express + Socket.IO + Prisma PostgreSQL)
  # ============================================================================
  - type: web
    name: civic-bridge-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: civic-bridge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: AUTH_ACCESS_COOKIE_NAME
        value: smartgov_access
      - key: AUTH_REFRESH_COOKIE_NAME
        value: smartgov_refresh
      - key: OTP_EXPIRY_MINUTES
        value: 10
      - key: ACCOUNT_LOCK_THRESHOLD
        value: 5
      - key: ACCOUNT_LOCK_MINUTES
        value: 15
      - key: ADMIN_ALLOWED_EMAILS
        value: smartgov.admin@gmail.com,admin@example.com,chera.admin@gmail.com
      - key: ALLOWED_ADMIN_DOMAINS
        value: smartgov.in,gov.in,nic.in,example.com,gmail.com

  # ============================================================================
  # 2. FRONTEND WEB SERVICE (TanStack Start / React SSR + Vite)
  # ============================================================================
  - type: web
    name: civic-bridge-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: BACKEND_URL
        fromService:
          type: web
          name: civic-bridge-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: VITE_API_BASE_URL
        value: /api

databases:
  # ============================================================================
  # 3. POSTGRESQL DATABASE (Render Free Managed Postgres)
  # ============================================================================
  - name: civic-bridge-db
    databaseName: citizen_db
    user: citizen_user
    plan: free
    region: oregon
